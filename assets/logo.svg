<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ec4899" />
      <stop offset="0.5" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Squircle Backdrop -->
  <rect x="2" y="2" width="40" height="40" rx="12" fill="#131427" stroke="url(#glowGrad)" stroke-width="1.5" />
  <!-- Stylized Geometric A Monogram with Spark & Motion Rings -->
  <path d="M14 31 L22 13 L30 31" stroke="url(#glowGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M17 25 L27 25" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="22" cy="19" r="2" fill="#38bdf8" />
</svg>
